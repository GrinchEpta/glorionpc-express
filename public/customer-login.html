<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlorionPC - вход в личный кабинет</title>
  <meta name="description" content="Вход в личный кабинет покупателя GlorionPC по email." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="brand">
        <div class="brand__logo-wrap">
          <img src="/images/logo-glorionpc.png" alt="GlorionPC" class="brand__logo" />
        </div>

        <div class="brand__content">
          <span class="brand__mark">GlorionPC</span>
          <span class="brand__text">Premium PC Store</span>
        </div>
      </a>

      <nav class="nav">
        <a href="/">Главная</a>
        <a href="/catalog.html">Каталог</a>
        <a href="/custom-pc.html">Заказать ПК</a>
        <a href="/configure.html">Конфигуратор ПК</a>
        <a href="/cart.html" class="cart-link" aria-label="Корзина">
          <span class="cart-link__text">Корзина</span>
          <span class="cart-link__target" id="cart-target"></span>
        </a>
        <a href="/orders.html">Заказы</a>
        <a href="/customer-account.html">Личный кабинет</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="orders-page customer-login-page">
      <div class="container">
        <div class="section-heading reveal">
          <p class="section-heading__eyebrow">GlorionPC</p>
          <h1 class="section-heading__title">Вход в личный кабинет</h1>
          <p class="section-heading__text">
            Введите email, получите одноразовый код и смотрите свои заказы с любого устройства.
          </p>
        </div>

        <div class="customer-login-card reveal">
          <form id="customer-login-form" class="checkout-form">
            <div class="form-group">
              <label for="customer-login-email">Email</label>
              <input
                type="email"
                id="customer-login-email"
                name="email"
                placeholder="example@mail.ru"
                required
              />
            </div>

            <button type="button" class="checkout-submit-btn" id="request-code-btn">
              Получить код
            </button>

            <div class="form-group">
              <label for="customer-login-code">Код из письма</label>
              <input
                type="text"
                id="customer-login-code"
                name="code"
                inputmode="numeric"
                maxlength="6"
                placeholder="000000"
                required
              />
            </div>

            <button type="submit" class="checkout-submit-btn">
              Войти
            </button>
          </form>

          <div id="customer-login-message"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/cart-utils.js"></script>
  <script src="/js/customer-login.js"></script>
  <script src="/js/reveal.js"></script>
  <script src="/js/mobile-menu.js"></script>

    <div class="support-widget__panel">
      <div class="support-widget__title">Поддержка</div>

      <div class="support-widget__list">
        <a href="tel:+79226976000" class="support-widget__item">
          <span class="support-widget__icon">📞</span>
          <span class="support-widget__text">
            <span class="support-widget__value">+7 922 697 60 00</span>
          </span>
        </a>

        <a href="https://vk.com/glorionpc" class="support-widget__item" target="_blank" rel="noopener noreferrer">

            </svg>
          </span>
          <span class="support-widget__text">
            <span class="support-widget__value">ВКонтакте</span>
          </span>

        <a href="https://www.avito.ru/brands/a4bbd309b2f33e4a6f1094337908086e" class="support-widget__item" target="_blank" rel="noopener noreferrer">
          <span class="support-widget__icon">

              <circle cx="7" cy="12" r="3" fill="#97CF26"/>

              <circle cx="17" cy="12" r="3" fill="#009CF0"/>
              <circle cx="12" cy="17" r="3" fill="#A169F7"/>

          <span class="support-widget__text">

          </span>

      </div>
    </div>

    <button class="support-widget__button" type="button" aria-label="Открыть поддержку">

        <path d="M12 12c2.761 0 5-2.239 5-5S14.761 2 12 2 7 4.239 7 7s2.239 5 5 5z" fill="currentColor"/>

  </div>
</body>
</html>
